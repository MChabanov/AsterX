name: CI

# Control when the workflow will run
on:
  push:
  pull_request:
    types: [opened, reopened, edited, review_requested, ready_for_review, synchronize]
  # Allow running this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      golden_master:
        description: 'Run the tight golden-master TSV comparison (near-machine precision, opt-in)'
        type: boolean
        default: false
# concurrency:
#   group: carpetx
#   cancel-in-progress: false

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job
  download-build-test:
    strategy:
      matrix:
        accelerator: [cpu, cuda, rocm]
        real-precision: [real64]
    env:
      ACCELERATOR: ${{matrix.accelerator}}
      REAL_PRECISION: ${{matrix.real-precision}}
      MODE: ${{matrix.mode}}

    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    container: lwji/carpetx:${{matrix.accelerator}}-${{matrix.real-precision}}

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Check out the repository under $GITHUB_WORKSPACE, so our job can access it
      - uses: actions/checkout@v4
          
      # # Check out the documentation and test results
      # - uses: actions/checkout@v3
      #   with:
      #     ref: gh-pages
      #     path: gh-pages
          
      - name: Log the triggering commit
        run: echo ${{github.event.client_payload.trigger}}

      - name: Install ccache
        run: apt-get update -y && apt-get install -y ccache || true

      - name: Restore compiler cache
        uses: actions/cache@v5
        with:
          path: .ccache
          key: ccache-${{matrix.accelerator}}-${{matrix.real-precision}}-${{github.sha}}
          restore-keys: |
            ccache-${{matrix.accelerator}}-${{matrix.real-precision}}-

      - name: Download Cactus
        run: /bin/bash $GITHUB_WORKSPACE/scripts/download.sh
        env:
          CCACHE_DIR: ${{github.workspace}}/.ccache

      - name: Build Cactus
        run: /bin/bash $GITHUB_WORKSPACE/scripts/build.sh
        env:
          CCACHE_DIR: ${{github.workspace}}/.ccache
      
      - name: Test Cactus
        if: ${{matrix.accelerator != 'cuda' && matrix.accelerator != 'rocm' && matrix.mode != 'debug'}}
        run: /bin/bash $GITHUB_WORKSPACE/scripts/test.sh

      # Optional golden-master check: re-compare the produced TSV output against
      # the committed reference data at a tight (near-machine) tolerance, far
      # stricter than the default testsuite (1e-8). Used to confirm a refactor
      # (e.g. the fused single-sweep flux calculation) reproduces results.
      # Opt-in: manual run with the `golden_master` input, or a PR labelled
      # `golden-master`. Off by default so normal CI is unaffected.
      - name: Golden-master TSV comparison (tight, opt-in)
        if: >-
          ${{ matrix.accelerator == 'cpu' && matrix.real-precision == 'real64' &&
              ((github.event_name == 'workflow_dispatch' && inputs.golden_master) ||
               contains(github.event.pull_request.labels.*.name, 'golden-master')) }}
        run: |
          python3 "$GITHUB_WORKSPACE/scripts/compare_tsv.py" \
              "$GITHUB_WORKSPACE/AsterX/test" "$ONEPROC_DIR" "$TWOPROC_DIR"

      # Upload the test-run output so the per-schedule timer report
      # (Cactus::cctk_timer_output = "full", enabled in the evolution test pars)
      # is retrievable from the run stdout captured under the output dirs.
      # Runs even on test failure so timing is always available.
      - name: Upload test output (timers)
        if: always() && matrix.accelerator == 'cpu' && matrix.real-precision == 'real64' && env.ONEPROC_DIR != ''
        uses: actions/upload-artifact@v4
        with:
          name: asterx-test-output
          path: |
            ${{env.ONEPROC_DIR}}
            ${{env.TWOPROC_DIR}}
          retention-days: 7
          if-no-files-found: warn

      # Set exit code based on test status
      - name: Set exit code
        # Only look at the test results for `carpetx-cpu-real64` runs
        if: ${{matrix.accelerator == 'cpu' && matrix.real-precision == 'real64' && env.TESTS_FAILED == 'True'}}
        run: exit 1
